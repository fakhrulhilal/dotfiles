services:
  broker-nats:
    image: nats:alpine
    container_name: broker.nats
    restart: unless-stopped
    labels:
      - dev.orbstack.domains=nats.broker.${DOMAIN}
      - dev.orbstack.http-port=8222
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: >
        (echo -e "GET /healthz HTTP/1.1\r\nHost: localhost\r\n\r\n"; sleep 0.1) | nc localhost 8222 | grep -q '"status":"ok"'
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    volumes:
      - nats_data:/data
    profiles: [ broker, nats ]
    command: "-m 8222 -js --sd /data"

  broker-zookeeper:
    image: confluentinc/cp-zookeeper:${KAFKA_VERSION}
    platform: linux/amd64
    container_name: broker.zookeeper
    labels:
      - dev.orbstack.domains=zookeeper.broker.${DOMAIN}
      - dev.orbstack.icon=https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/Apache_ZooKeeper_logo.svg/330px-Apache_ZooKeeper_logo.svg.png
    ports:
      - "2181:2181"
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 2181" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    profiles: [ broker, kafka ]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  broker-kafka:
    image: confluentinc/cp-kafka:${KAFKA_VERSION}
    platform: linux/amd64
    container_name: broker.kafka
    depends_on:
      broker-zookeeper:
        condition: service_healthy
    labels:
      - dev.orbstack.domains=kafka.broker.${DOMAIN}
      - dev.orbstack.icon=https://raw.githubusercontent.com/apache/kafka-site/asf-site/logos/kafka_logo--simple.png
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    profiles: [ broker, kafka ]
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "broker.zookeeper:2181"
      # INTERNAL: container-to-container (29092). EXTERNAL: apps on the host (9092)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker.kafka:29092,EXTERNAL://${HOST_ADDR:-kafka.broker.${DOMAIN}}:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  broker-schema-registry:
    image: confluentinc/cp-schema-registry:${KAFKA_VERSION}
    platform: linux/amd64
    container_name: broker.schema-registry
    depends_on:
      broker-zookeeper:
        condition: service_healthy
      broker-kafka:
        condition: service_healthy
    labels:
      - dev.orbstack.domains=schema-registry.broker.${DOMAIN}
      - dev.orbstack.http-port=8080
      - dev.orbstack.icon=https://docs.confluent.io/_static/favicon.ico
    restart: unless-stopped
    profiles: [ broker, kafka ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:8080/mode | grep -qiE '\"mode\":\"\\w+\"'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://broker.kafka:29092"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8080"

  broker-redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    container_name: broker.redpanda
    restart: unless-stopped
    profiles: [ broker, redpanda ]
    labels:
      - dev.orbstack.domains=redpanda.broker.${DOMAIN}
      - dev.orbstack.http-port=8081
      - dev.orbstack.icon=https://cdn.prod.website-files.com/68ed36e99e31581dedf5dc7c/68fbe910c263282ff5f65171_webclip.png
    healthcheck:
      test: [ "CMD-SHELL", "rpk cluster health | grep -q 'Healthy:\\s*true'" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    command:
      - redpanda start
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://broker.redpanda:29092,external://${HOST_ADDR:-redpanda.broker.${DOMAIN}}:9092
      - --pandaproxy-addr internal://0.0.0.0:28082,external://0.0.0.0:8082
      - --advertise-pandaproxy-addr internal://broker.redpanda:28082,external://${HOST_ADDR:-redpanda.broker.${DOMAIN}}:8082
      - --schema-registry-addr internal://0.0.0.0:28081,external://0.0.0.0:8081
      - --rpc-addr broker:33145
      - --advertise-rpc-addr broker:33145
      - --mode dev-container
      - --smp 1
      - --overprovisioned
      - --memory 1G
      - --reserve-memory 0M
      - --default-log-level=info
      - --set redpanda.data_transforms_enabled=true
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    ports:
      - "8081:8081"
      - "8082:8082"
      - "9644:9644"
    environment:
      REDPANDA_ENABLE_USAGE_STATS: false
      REDPANDA_DATA_TRANSFORMS_ENABLED: true
    networks:
      default:
        aliases:
          - schema-registry
          - rest-proxy

  broker-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: broker.console
    restart: unless-stopped
    profiles: [ broker, redpanda ]
    labels:
      - dev.orbstack.domains=console.broker.${DOMAIN}
      - dev.orbstack.http-port=8080
      - dev.orbstack.icon=https://cdn.prod.website-files.com/68ed36e99e31581dedf5dc7c/68fbe910c263282ff5f65171_webclip.png
    depends_on:
      broker-schema-registry:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        cat <<EOF > /tmp/config.yml
        kafka:
          brokers: [ "broker.kafka:29092" ]
        schemaRegistry:
          enabled: true
          urls: [ "http://broker.schema-registry:8080" ]
        EOF

        if [ "$$TARGET" = "redpanda" ]; then
          cat <<EOF >> /tmp/config.yml
        redpanda:
          adminApi:
            enabled: true
            urls: [ "http://broker:9644" ]
        EOF
        fi

        exec /app/console
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/admin/health | grep -q '\"isHttpOk\":true'" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      TARGET: kafka
      CONFIG_FILEPATH: /tmp/config.yml

volumes:
  nats_data:
  kafka_data:
  redpanda_data: