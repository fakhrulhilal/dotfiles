services:
  cache-redis:
    image: redis:7-alpine
    container_name: cache.redis
    labels:
      - dev.orbstack.domains=redis.cache.${DOMAIN}
      - dev.orbstack.icon="https://redis.io/apple-icon.png"
    ports:
      - "6379:6379"
    restart: unless-stopped
    profiles: [ cache ]
    healthcheck:
      test: [ "CMD-SHELL", "[ \"$$(redis-cli -h localhost ping)\" = 'PONG' ]" ]
      interval: 30s
      timeout: 5s
      retries: 3