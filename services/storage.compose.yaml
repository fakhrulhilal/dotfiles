services:
  storage-azurite-setup:
    image: alpine/openssl
    container_name: storage.azurite.setup
    entrypoint: [ "sh", "-c" ]
    command:
      - tr -d '\n' < /run/secrets/app_password | openssl dgst -sha512 -binary | openssl base64 -A > /key/azurite_key
    volumes:
      - azurite-key_data:/key
    profiles: [ storage, blob ]
    secrets:
      - app_password

  storage-azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: storage.azurite
    labels:
      - dev.orbstack.domains=azurite.storage.${DOMAIN},${AZURITE_ACCOUNT:-lab-account}.blob.azurite.storage.${DOMAIN}
      - dev.orbstack.http-port=10000
      - dev.orbstack.icon="https://azure.microsoft.com/svghandler/storage-blobs/?width=64"
    volumes:
      - azurite_data:/data
      - azurite-key_data:/key:ro
    ports:
      - "10000:10000"
    depends_on:
      storage-azurite-setup:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.1 10000" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    # AZURITE_ACCOUNTS only comes from the environment, so it is read from the key file at start up.
    # A custom account replaces the default devstoreaccount1.
    entrypoint: [ "sh", "-c" ]
    command:
      - >-
        export AZURITE_ACCOUNTS="$${BLOB_ACCOUNT}:$$(cat /key/azurite_key)"
        && exec azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
    profiles: [ storage, blob ]
    environment:
      BLOB_ACCOUNT: ${AZURITE_ACCOUNT:-lab-account}
    networks:
      default:
        aliases:
          - "${AZURITE_ACCOUNT:-lab-account}.blob.azurite.storage.${DOMAIN}"
          - azurite

  storage-azurite-init:
    image: oven/bun:1-alpine
    container_name: storage.azurite.init
    depends_on:
      storage-azurite:
        condition: service_healthy
    profiles: [ storage, blob ]
    volumes:
      - ./init/azurite:/migrations:ro
      - azurite-key_data:/key:ro
    entrypoint: [ "bun", "/migrations/migrate.ts" ]
    environment:
      TZ: ${TZ}
      # production-style URL: the account name is taken from the first label
      BLOB_URL: http://${AZURITE_ACCOUNT:-lab-account}.blob.azurite.storage.${DOMAIN}:10000
      BLOB_ACCOUNT_KEY_FILE: /key/azurite_key
    restart: no

  storage-rustfs:
    image: rustfs/rustfs:latest
    container_name: storage.rustfs
    labels:
      - dev.orbstack.domains=rustfs.storage.${DOMAIN},s3.storage.${DOMAIN}
      - dev.orbstack.http-port=9001
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:9000/health" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    profiles: [ storage, s3 ]
    environment:
      TZ: ${TZ}
      RUSTFS_ACCESS_KEY: ${APP_USERNAME}
      RUSTFS_SECRET_KEY: ${APP_PASSWORD}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: true
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    networks:
      default:
        aliases:
          - storage-s3

volumes:
  azurite_data:
  azurite-key_data:
  rustfs_data:
  rustfs_logs: