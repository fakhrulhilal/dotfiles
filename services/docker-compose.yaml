name: lab

services:
  # health check binary for shell-less images: the image is FROM scratch (no cp), so mounting the empty
  # tiny-hc_bin volume over /bin lets Docker seed it with /bin/tiny-hc. Remove the volume to pick up a new version.
  tool-tiny-hc:
    image: iroel/tiny-hc:latest
    container_name: tool.tiny-hc
    restart: no
    command: [ "--version" ]
    volumes:
      - tiny-hc_bin:/bin

include:
  - db.compose.yaml
  - storage.compose.yaml
  - cache.compose.yaml
  - mail.compose.yaml
  - pkg.compose.yaml
  - broker.compose.yaml
  - workflow.compose.yaml
  - otlp.compose.yaml
  #- path: lab/lab.compose.yaml
  #  project_directory: .

volumes:
  tiny-hc_bin:

secrets:
  app_password:
    file: ./secrets/app_password.txt

networks:
  default:
    name: backend
    attachable: true