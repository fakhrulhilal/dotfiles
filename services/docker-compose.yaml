name: lab

services:
  # health check binary for shell-less images: the image is FROM scratch (no cp), so mounting the empty
  # tiny-hc_bin volume over /bin lets Docker seed it with /bin/tiny-hc. Remove the volume to pick up a new version.
  tool-tiny-hc:
    image: iroel/tiny-hc:latest
    container_name: tool.tiny-hc
    restart: no
    command: [ "--version" ]
    volumes:
      - tiny-hc_bin:/bin

  # self-signed chain (root CA -> intermediate CA -> wildcard certificates) shared through the certificate volume;
  # files are only created when missing. Import root-CA.crt and server-CA.crt into the host to trust it.
  tool-cert:
    image: alpine/openssl
    container_name: tool.cert
    restart: no
    entrypoint: [ "sh", "/init/generate.sh" ]
    volumes:
      - ./init/cert:/init:ro
      - certificate:/certs
    environment:
      BASE_DOMAIN: ${DOMAIN}
      # one per <category>.compose.yaml: each gets <category>.${DOMAIN} and *.<category>.${DOMAIN}
      DOMAIN: auth,broker,cache,db,mail,pkg,otlp,storage,workflow
      CERT_PASSWORD: ${CERT_PASSWORD:-$APP_PASSWORD}

include:
  - db.compose.yaml
  - storage.compose.yaml
  - cache.compose.yaml
  - mail.compose.yaml
  - pkg.compose.yaml
  - broker.compose.yaml
  - workflow.compose.yaml
  - otlp.compose.yaml
  - auth.compose.yaml
  #- path: lab/lab.compose.yaml
  #  project_directory: .

volumes:
  tiny-hc_bin:
  certificate:

secrets:
  app_password:
    file: ./secrets/app_password.txt

networks:
  default:
    name: backend
    attachable: true