  lab-management:
    image: iroel/lab/server
    container_name: lab.management
    hostname: lab
    build:
      context: ./lab
      dockerfile: cosmos.Dockerfile
    restart: unless-stopped
    profiles: [ lab ]
    #privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      - /:/host:ro
      #- /var/lib/cosmos:/config
      - management_data:/var/lib/cosmos
      - $HOME/proyek/certificates:/certificates
      - $HOME/proyek/dotfiles:/dotfiles:ro
    network_mode: host
    healthcheck:
      test: [ "CMD-SHELL", "curl -ks -o /dev/null https://localhost" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  lab-dns:
    image: technitium/dns-server
    container_name: lab.dns
    # host networking publishes 53, 67/udp, 8053 and 44353 directly
    network_mode: host
    hostname: technitium
    labels:
      - dev.orbstack.http-port=8053
    profiles: [ lab ]
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8053'" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      - DNS_SERVER_DOMAIN=lab.iroel.xyz
      - DNS_SERVER_ADMIN_PASSWORD="${APP_PASSWORD}"
      - DNS_SERVER_WEB_SERVICE_HTTP_PORT=8053
      - DNS_SERVER_WEB_SERVICE_HTTPS_PORT=44353
      - DNS_SERVER_WEB_SERVICE_USE_SELF_SIGNED_CERT=false
      - DNS_SERVER_FORWARDERS=8.8.8.8,1.1.1.1
      - DNS_SERVER_FORWARDER_PROTOCOL=Https
      - DNS_SERVER_LOG_USING_LOCAL_TIME=true
      - TZ=${TZ}
    volumes:
      - dns_data:/etc/dns
    restart: unless-stopped

  lab-monitor:
    container_name: lab.monitor
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    labels:
      - dev.orbstack.http-port=3001
    profiles: [ lab ]
    networks:
      - default
      - frontend
    volumes:
      - monitor_data:/app/data
    # image ships its own HEALTHCHECK
    environment:
      PORT: 3001
      #CLEANUP_INTERVAL: 30d

  lab-ddns:
    image: qmcgaw/ddns-updater
    container_name: lab.ddns
    network_mode: bridge
    labels:
      - dev.orbstack.http-port=8000
    profiles: [ lab ]
    #ports:
    #  - 8054:8000/tcp
    volumes:
      - ddns_data:/updater/data
    # image ships its own HEALTHCHECK
    environment:
      - TZ=${TZ}
      - PERIOD=30m
      - UPDATE_COOLDOWN_PERIOD=1h
      - PUBLICIP_FETCHERS=all
      - PUBLICIP_HTTP_PROVIDERS=all
      - PUBLICIPV4_HTTP_PROVIDERS=all
      - PUBLICIPV6_HTTP_PROVIDERS=all
      - PUBLICIP_DNS_PROVIDERS=all
      - PUBLICIP_DNS_TIMEOUT=3s
      - HTTP_TIMEOUT=10s
      - HEALTH_HEALTHCHECKSIO_UUID="get-from-healthcheck.io-dashboard"

      # Web UI
      - LISTENING_ADDRESS=:8000
      - ROOT_URL=/

      # Backup
      - BACKUP_PERIOD=0 # 0 to disable
      - BACKUP_DIRECTORY=/updater/data

      # Other
      - LOG_LEVEL=info
      - LOG_CALLER=hidden
      - SHOUTRRR_ADDRESSES=
    restart: unless-stopped

  lab-iot:
    image: homebridge/homebridge:latest
    #restart: unless-stopped
    container_name: lab.iot
    network_mode: host
    profiles: [ lab ]
    volumes:
      - iot_data:/homebridge
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '1'
    environment:
      TZ: ${TZ}
      ENABLE_AVAHI: 0
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail localhost:8581 || exit 1" ]
      interval: 60s
      retries: 5
      start_period: 300s
      timeout: 2s

volumes:
  management_data:
  dns_data:
  monitor_data:
  ddns_data:
  ai-backend_data:
  ai-frontend_data:
  iot_data:

networks:
  ainet:
  frontend:
    name: frontend