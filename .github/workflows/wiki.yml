name: wiki

# Publishes docs/*.md to the GitHub wiki (https://github.com/<owner>/<repo>/wiki). docs/ stays the source of truth: the
# wiki repo is wiped and refilled on every run, so edits made in the wiki UI are lost.
# Wiki page names come from file names, so name files the way the page title should read (Developing-CSharp-Script.md).
# Home.md, _Sidebar.md and _Footer.md are the wiki's special pages.
# Wiki commits are authored by whoever authored the source commit (the pushed HEAD).
on:
  push:
    branches: [ master ]
    paths: [ "docs/**", ".github/workflows/wiki.yml" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Copy docs into the wiki
        run: |
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp docs/*.md wiki/
          sed -i -E \
            -e "s|\]\(\.\./|](https://github.com/${GITHUB_REPOSITORY}/blob/master/|g" \
            -e 's/\]\(([A-Za-z0-9_-]+)\.md(#[^)]*)?\)/](\1\2)/g' \
            wiki/*.md

      - name: Push
        working-directory: wiki
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "Wiki is up to date"
            exit 0
          fi
          # Credit the author of the source commit instead of the bot, so the wiki history shows who wrote the change.
          git config user.name "$(git -C "$GITHUB_WORKSPACE" log -1 --format=%an "$GITHUB_SHA")"
          git config user.email "$(git -C "$GITHUB_WORKSPACE" log -1 --format=%ae "$GITHUB_SHA")"
          git commit -m "docs: Sync from ${GITHUB_SHA::7}"
          git push