# Minimal setup, loaded on every machine (e.g. a small server VPS). Linked to ~/.config/mise/config.toml.
# Everything else lives in conf.d/<tier>.toml, which shell/install/mise.sh links into ~/.config/mise/conf.d/
# unless DOT_MINIMAL is set (DOT_MISE_TIERS picks only some tiers).

[tools]
# mise essentials
usage = {
    version = "latest",
    postinstall = '''
        if [ -d "$HOME/.local/share/zsh/completion" ]; then
            usage --completions zsh > "$HOME/.local/share/zsh/completion/_usage"
        fi
        if [ -d "$HOME/.local/share/bash-completion/completions" ]; then
            usage --completions bash > "$HOME/.local/share/bash-completion/completions/usage"
        fi
        '''
}
fnox = {
    version = "latest",
    postinstall = '''
        if [ -d "$HOME/.local/share/zsh/completion" ]; then
            fnox completion zsh > "$HOME/.local/share/zsh/completion/_fnox"
        fi
        if [ -d "$HOME/.local/share/bash-completion/completions" ]; then
            fnox completion bash > "$HOME/.local/share/bash-completion/completions/fnox"
        fi
        '''
} # secret manager
age = "latest" # encryption tool

# shell essentials
fzf = {
    version = "latest",
    postinstall = '''
        if [ -d "$HOME/.local/share/zsh/completion" ]; then
            fzf --zsh > "$HOME/.local/share/zsh/completion/_fzf"
        fi
        if [ -d "$HOME/.local/share/bash-completion/completions" ]; then
            fzf --bash > "$HOME/.local/share/bash-completion/completions/fzf"
        fi
        '''
}
"bat" = {
    version = "latest",
    postinstall = '''
        if [ -d "$HOME/.local/share/zsh/completion" ]; then
            bat --completion zsh > "$HOME/.local/share/zsh/completion/_bat"
        fi
        if [ -d "$HOME/.local/share/bash-completion/completions" ]; then
            bat --completion bash > "$HOME/.local/share/bash-completion/completions/bat"
        fi
        '''
} # cat alternative
lsd = {
    version = "latest",
    postinstall = '''
        src="$(echo "$MISE_TOOL_INSTALL_PATH"/lsd-*/autocomplete)" # bundled in the release archive
        if [ -d "$HOME/.local/share/zsh/completion" ]; then
            cp "$src/_lsd" "$HOME/.local/share/zsh/completion/_lsd"
        fi
        if [ -d "$HOME/.local/share/bash-completion/completions" ]; then
            cp "$src/lsd.bash-completion" "$HOME/.local/share/bash-completion/completions/lsd"
        fi
        '''
} # ls alternative
yq = {
    version = "latest",
    postinstall = '''
        if [ -d "$HOME/.local/share/zsh/completion" ]; then
            yq completion zsh > "$HOME/.local/share/zsh/completion/_yq"
        fi
        if [ -d "$HOME/.local/share/bash-completion/completions" ]; then
            yq completion bash > "$HOME/.local/share/bash-completion/completions/yq"
        fi
        '''
} # jq with yaml support
neovim = "latest"
lazygit = {
    version = "latest",
    postinstall = '''
        if [ -d "$HOME/.local/share/zsh/completion" ]; then
            lazygit completion zsh > "$HOME/.local/share/zsh/completion/_lazygit"
        fi
        if [ -d "$HOME/.local/share/bash-completion/completions" ]; then
            lazygit completion bash > "$HOME/.local/share/bash-completion/completions/lazygit"
        fi
        '''
} # GIT client
"delta" = {
    version = "latest",
    postinstall = '''
        if [ -d "$HOME/.local/share/zsh/completion" ]; then
            delta --generate-completion zsh > "$HOME/.local/share/zsh/completion/_delta"
        fi
        if [ -d "$HOME/.local/share/bash-completion/completions" ]; then
            delta --generate-completion bash > "$HOME/.local/share/bash-completion/completions/delta"
        fi
        '''
} # diff viewer, git's pager (config/git.txt)

# stack (the .NET SDK comes from dotnetup, see shell/install/dotnet.sh)
bun = {
    version = "latest",
    postinstall = '''
        if [ -d "$HOME/.local/share/zsh/completion" ]; then
            SHELL=/bin/zsh bun completions > "$HOME/.local/share/zsh/completion/_bun"
        fi
        if [ -d "$HOME/.local/share/bash-completion/completions" ]; then
            SHELL=/bin/bash bun completions > "$HOME/.local/share/bash-completion/completions/bun"
        fi
        '''
}

[settings]

experimental = true

[settings.cargo]
binstall = true

[settings.pipx]
uvx = true # install pipx: tools through uv

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = true

[bootstrap.macos.finder]
show_pathbar = true
preferred_view_style = "icon"

[bootstrap.macos.dock]
autohide = true
orientation = "bottom"
magnification = true
largesize = 100