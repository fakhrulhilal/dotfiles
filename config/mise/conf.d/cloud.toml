# Cloud CLIs and networking.

[env]
# gcloud prefers python3.14..3.12 from PATH (e.g. Homebrew's) over python3, so point it at mise's python
CLOUDSDK_PYTHON = "python3"

[tools]
"pipx:azure-cli" = { version = "latest", depends = "uv" }
"github:Elpulgo/azdo" = "latest" # Azure DevOps client
"http:gcloud" = {
    os = ["macos", "linux"],
    version = "latest",
    url = 'https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-{{ version }}-{{ os(macos="darwin") }}-{{ arch(x64="x86_64", arm64="arm") }}.tar.gz',
    version_list_url = "https://dl.google.com/dl/cloudsdk/channels/rapid/components-2.json",
    version_regex = '"version": "(\d+(?:\.\d+)+)"',
    bin_path = "google-cloud-sdk/bin",
    depends = "python" # gcloud needs python 3.10 to 3.15
}
"go:tailscale.com/cmd/tailscale" = { version = "latest", depends = "go" } # Tailscale without installation
"go:tailscale.com/cmd/tailscaled" = { version = "latest", depends = "go" }
"npm:neon" = { version = "latest", depends = "node" } # Neon CLI; `neon plugins` adds its agent skills + MCP
"npm:resend-cli" = {
    version = "latest",
    postinstall = '''
        if [ -d "$HOME/.local/share/zsh/completion" ]; then
            resend completion zsh > "$HOME/.local/share/zsh/completion/_resend"
        fi
        if [ -d "$HOME/.local/share/bash-completion/completions" ]; then
            resend completion bash > "$HOME/.local/share/bash-completion/completions/resend"
        fi
        '''
} # secret manager