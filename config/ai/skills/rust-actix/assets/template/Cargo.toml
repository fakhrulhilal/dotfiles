[package]
name = "todo-actix"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
# No default features: compression (brotli, gzip, zstd build C code), cookies and the old `compat` APIs are opt-in.
actix-web = { version = "4.18", default-features = false, features = ["macros"] }
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
actix-http = "3"
