[package]
name = "todo-ntex"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
# `compio` runs every worker on a compio runtime. Without a runtime feature ntex uses its own "neon" runtime, and
# `tokio` wins when both `tokio` and `compio` are enabled.
ntex = { version = "4.3", features = ["compio"] }
# compio's own APIs (fs, time, process, ...) run on the runtime ntex starts. Keep this on the same minor as the
# compio-runtime that ntex-net uses (compio 0.19 = compio-runtime 0.12), or the two never meet. `polling` lets Linux
# fall back to epoll where io_uring is unavailable (Docker's default seccomp profile blocks it) instead of panicking.
compio = { version = "0.19", default-features = false, features = ["runtime", "io-uring", "polling", "fs", "time"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
