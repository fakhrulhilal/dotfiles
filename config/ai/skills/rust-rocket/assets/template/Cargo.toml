[package]
name = "todo-rocket"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
# json: the Json guard and responder. uuid: Uuid as a path parameter (FromParam) and in forms.
rocket = { version = "0.5.2", features = ["json", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }
