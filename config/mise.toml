[vars]
ngrok_channel_id = "bNyj1mQVY4c"

[plugins]
"vfox-backend:csharp" = "{{ env.DOT_HOME }}/csharp/mise-plugin" # publish *Cli.cs from this repo

# Prebuilt csharp:<Script> releases (tag <AssemblyName>-v<Version>, see .github/workflows/csharp.yml).
# Install with `mise use -g dotclock`. One alias per tool keeps mise's version caches apart.
[tool_alias]
dotclock = "github:fakhrulhilal/dotfiles[version_prefix=dotclock-v]"
dotkafka = "github:fakhrulhilal/dotfiles[version_prefix=dotkafka-v]"
dothook = "github:fakhrulhilal/dotfiles[version_prefix=dothook-v]"

[tools]
usage = "latest"

# languages
rust = "latest"
cargo-binstall = "latest"
go = "latest"
node = "lts"
deno = {
    version = "latest",
    postinstall = '''
        if [ -d "$HOME/.local/share/zsh/completion" ]; then
            deno completions zsh > "$HOME/.local/share/zsh/completion/_deno"
        fi
        if [ -d "$HOME/.local/share/bash-completion/completions" ]; then
            deno completions bash > "$HOME/.local/share/bash-completion/completions/deno"
        fi
        '''
}
bun = "latest"
python = { version = "3.12", postinstall = "pip install --force-reinstall pipx" }
uv = "latest" # Python package and project manager
zig = "latest"
aspire = "latest"
"dotnet:apache.avro.tools" = "1.12.1"
"dotnet:csharprepl" = "latest"
"dotnet:dotnet-ef" = "8"
"dotnet:yuniql.cli" = "latest"
"dotnet:dotnet-reportgenerator-globaltool" = "latest"
"csharp:ClockifyCli" = "latest" # clock#
"csharp:KafkaCli" = "latest" # kafka#
"csharp:WebhookCli" = "latest"

# AI
opencode = "latest"
"copilot" = "latest"
claude = "latest"
antigravity-cli = "latest"

# shell
powershell = "latest"
lsd = "latest" # ls alternative
ripgrep = "latest" # grep alternative
yq = "latest" # jq with yaml support
jless = "latest" # another JSON viewer with nested tree
"cargo:bat" = { version = "latest", depends = "rust" } # cat alternative
"github:dandavison/delta" = { version = "latest" } # diff viewer
fd = "latest" # find alternative
fzf = "latest"
"github:sachaos/viddy" = { version = "latest", depends = "rust" } # watch alternative
"github:brevity1swos/rgx" = {
    version = "latest",
    postinstall = '''
        if [ -d "$HOME/.local/share/zsh/completion" ]; then
            rgx --completions zsh > "$HOME/.local/share/zsh/completion/_rgx"
        fi
        if [ -d "$HOME/.local/share/bash-completion/completions" ]; then
            rgx --completions bash > "$HOME/.local/share/bash-completion/completions/rgx"
        fi
        '''
} # regex helper
"cargo:darya" = { version = "latest", depends = "rust" } # disk usage analysis
"github:facebook/zstd" = {
    os = ["macos", "linux"],
    version = "latest",
    asset_pattern = "zstd-{{ version }}.tar.gz",
    bin_path = "zstd-{{ version }}/programs",
    filter_bins = "zstdless,zstdgrep",
    postinstall = '''
        target_dir="$MISE_TOOL_INSTALL_PATH/zstd-$MISE_TOOL_VERSION"
        make -C "$target_dir" -j$(sysctl -n hw.ncpu || echo 2)
        mv "$target_dir/programs" "$MISE_TOOL_INSTALL_PATH/bin"
        '''
}
herdr = {
    version = "latest",
    postinstall = '''
        if [ -d "$HOME/.local/share/zsh/completion" ]; then
            herdr completion zsh > "$HOME/.local/share/zsh/completion/_herdr"
        fi
        if [ -d "$HOME/.local/share/bash-completion/completions" ]; then
            herdr completion bash > "$HOME/.local/share/bash-completion/completions/herdr"
        fi
        '''
}
"github:hatoo/oha" = "latest" # alternative for ark, web benchmark tool
# wrk (web benchmark tool with Lua scripting) publishes no binaries, so it is built from the release source.
# macOS links Homebrew's luajit and openssl@3; Linux builds the bundled LuaJIT and OpenSSL
# (needs make, gcc, perl, unzip).
"http:wrk" = {
    os = ["macos", "linux"],
    version = "4.2.0",
    url = "https://github.com/wg/wrk/archive/refs/tags/{{ version }}.tar.gz",
    bin_path = "bin",
    postinstall = '''
        set -e
        src="$MISE_TOOL_INSTALL_PATH/wrk-$MISE_TOOL_VERSION"
        set -- "VER=$MISE_TOOL_VERSION"
        if [ "$(uname)" = "Darwin" ]; then
            luajit="$(brew --prefix --installed luajit)"
            # the Makefile runs luajit from PATH to compile wrk.lua and expects the luajit-2.1 headers
            export PATH="$luajit/bin:$PATH" CFLAGS="-I$luajit/include/luajit-2.1 $CFLAGS"
            set -- "$@" "WITH_LUAJIT=$luajit" "WITH_OPENSSL=$(brew --prefix --installed openssl@3)"
        fi
        # serial like Homebrew's formula, the Makefile isn't written for -j
        make -C "$src" "$@"
        mkdir -p "$MISE_TOOL_INSTALL_PATH/bin"
        mv "$src/wrk" "$MISE_TOOL_INSTALL_PATH/bin/"
        rm -rf "$src"
        '''
}
"cargo:difftastic" = "latest" # similar to delta, a diff with treesitter support
"cargo:git-cliff" = "latest" # git changelog generator
"cargo:ouch" = "latest" # alternative to tar, compression toolkit

# software development
neovim = "latest"
lazygit = "latest" # GIT client
"github:cube2222/octosql" = "latest" # explore csv, yaml, json using SQL query or event DB
fnox = {
    version = "latest",
    postinstall = '''
        if [ -d "$HOME/.local/share/zsh/completion" ]; then
            fnox completion zsh > "$HOME/.local/share/zsh/completion/_fnox"
        fi
        if [ -d "$HOME/.local/share/bash-completion/completions" ]; then
