} # secret manager
age = "latest" # encryption tool
"github:maif/yozefu" = "latest" # Kafka client
redis = "8.6.2"
"http:ngrok" = {
    version = "3",
    url = 'https://bin.ngrok.com/c/{{ vars.ngrok_channel_id }}/ngrok-v{{ version }}-stable-{{ os(macos="darwin") }}-{{ arch(x64="amd64", x32="386") }}.{{ os(macos="zip", windows="zip", linux="tgz") }}'
}
"npm:@playwright/cli" = "latest"
"cargo:topcoat-cli" = "latest"
"cargo:dioxus-cli" = "latest"
"cargo:trunk" = "latest"
"github:microsoft/go-sqlcmd" = "latest" # Modernized SQL Server client (sqlcmd Go version)
"github:duckdb/duckdb" = "latest"
# PostgreSQL client (psql, pg_dump, libpq) built from the official source, ported from Homebrew's postgresql@17.
# macOS takes the libraries from Homebrew; Linux needs libssl-dev, libreadline-dev, liblz4-dev, libzstd-dev, pkg-config.
"http:postgresql" = {
    os = ["macos", "linux"],
    version = "18",
    url = "https://ftp.postgresql.org/pub/source/v{{ version }}/postgresql-{{ version }}.tar.bz2",
    checksum_url = "https://ftp.postgresql.org/pub/source/v{{ version }}/postgresql-{{ version }}.tar.bz2.sha256",
    version_list_url = "https://ftp.postgresql.org/pub/source/",
    version_regex = 'href="v(\d+(?:\.\d+)+)/"',
    version_expr = "sortVersions(versions)",
    bin_path = "bin",
    postinstall = '''
        set -e
        src="$MISE_TOOL_INSTALL_PATH/postgresql-$MISE_TOOL_VERSION"
        set --
        if [ "$(uname)" = "Darwin" ]; then
            for formula in openssl@3 readline lz4 zstd; do
                prefix="$(brew --prefix --installed "$formula")"
                export CPPFLAGS="-I$prefix/include $CPPFLAGS" LDFLAGS="-L$prefix/lib $LDFLAGS"
                export PKG_CONFIG_PATH="$prefix/lib/pkgconfig:$PKG_CONFIG_PATH"
            done
            set -- "PG_SYSROOT=$(xcrun --show-sdk-path)"
        fi
        cd "$src"
        ./configure --prefix="$MISE_TOOL_INSTALL_PATH" --without-icu --with-openssl --with-lz4 --with-zstd "$@"
        jobs="-j$(getconf _NPROCESSORS_ONLN)"
        # build the libraries shared by src/bin first, parallel submakes of them race each other
        for dir in src/port src/common src/fe_utils; do
            make -C "$dir" "$jobs"
        done
        for dir in src/include src/interfaces src/bin; do
            make -C "$dir" "$jobs" install
        done
        cd "$MISE_TOOL_INSTALL_PATH"
        rm -rf "$src"
        '''
}
"github:pgplex/pgschema" = "latest"

# cloud
"pipx:azure-cli" = { version = "latest", depends = "uv" }
"cargo:csvlens" = "latest"
"github:Elpulgo/azdo" = "latest" # Azure DevOps client
"go:tailscale.com/cmd/tailscale" = "latest" # Tailscale without installation
"go:tailscale.com/cmd/tailscaled" = "latest"
"github:nektos/act" = "latest" # Github actions simulator
gh = "2.101.0"

[settings]

experimental = true

[settings.cargo]
binstall = true

[settings.pipx]
uvx = true # install pipx: tools through uv

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = true

[bootstrap.macos.finder]
show_pathbar = true
preferred_view_style = "icon"

[bootstrap.macos.dock]
autohide = true
orientation = "bottom"
magnification = true
largesize = 100
