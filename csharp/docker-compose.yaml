name: dotfiles

services:
  webhook:
    image: iroel/webhook
    container_name: webhook
    build:
      platforms:
        - linux/amd64
        - linux/arm64
      args:
        SCRIPT_FILE: WebhookCli.cs
      labels:
        org.opencontainers.image.title: "Webhook Receiver"
        org.opencontainers.image.description: "Simple webhook which receives and validate signature"
        org.opencontainers.image.licenses: "MIT"
        org.opencontainers.image.revision: "${GIT_COMMIT_SHA:-unknown}"
        org.opencontainers.image.created: "${BUILD_TIMESTAMP:-unknown}"
        com.docker.desktop.extension.icon: "https://devicons.io/devicons/icons/webhooks.svg"
        dev.orbstack.icon: "https://devicons.io/devicons/icons/webhooks.svg"
    restart: unless-stopped
    user: "root"
    healthcheck:
      test: ["CMD", "/home/app/httpcheck", "http://localhost:8080/_health/ready"]
      start_period: 3s
      interval: 10s
      timeout: 2s
      retries: 3
    labels:
      dev.orbstack.domains: webhook.dev.local
      dev.orbstack.http-port: 8080
    volumes:
      - webhook_data:/var/app/data
      - common_data:/var/app/common
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      App__IconPath: "/var/app/common/webhook.ico"
      Db__Type: Sqlite
      DB__ConnectionString: "Data Source=/var/app/data/webhook.db;"
      Logging__LogLevel__Default: "Information"
      Logging__LogLevel__System: "Error"
      Logging__LogLevel__Microsoft: "Error"
      Logging__LogLevel__Microsoft.Hosting.Lifetime: "Information"

  proxy:
    image: ngrok/ngrok:latest
    container_name: ngrok
    labels:
      dev.orbstack.domains: proxy.webhook.dev.local
      dev.orbstack.http-port: 4040
    depends_on:
      webhook:
        condition: service_healthy
    environment:
      NGROK_AUTHTOKEN: "$NGROK_TOKEN"
      NGROK_URL: "$NGROK_URL"
    command: http http://webhook:8080 --url "$NGROK_URL"

volumes:
  common_data:
  webhook_data: